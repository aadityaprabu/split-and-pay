# Included by every block in nginx.conf that sets its own add_header: nginx drops all
# inherited add_header lines as soon as a location adds one, so they must be repeated.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Google Identity Services (sign-in button) needs its script, iframe, styles and API allowed;
# profile photos are served from googleusercontent.com.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://*.googleusercontent.com; script-src 'self' https://accounts.google.com/gsi/client; frame-src https://accounts.google.com/gsi/; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; font-src 'self'; connect-src 'self' https://accounts.google.com/gsi/;" always;
