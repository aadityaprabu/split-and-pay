# Yarn 4, committed in .yarn/releases so every machine and the Docker build run the same version
# (Node 26 no longer ships Corepack). A global `yarn` of any version hands off to this file.
yarnPath: .yarn/releases/yarn-4.18.1.cjs

# A plain node_modules folder instead of Plug'n'Play, so node --test, ESLint and editors work unchanged
nodeLinker: node-modules

enableTelemetry: false
